apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-app
  template:
    metadata:
      labels:
        app: mall-app
    spec:
      containers:
        - name: app
          image: mall-ops-app:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: mall-mysql
            - name: DB_USER
              value: mall
            - name: DB_PASSWORD
              value: mall123
            - name: DB_NAME
              value: mall
            - name: REDIS_HOST
              value: mall-redis
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mall-app
spec:
  type: NodePort
  selector:
    app: mall-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080