services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mall
      MYSQL_USER: mall
      MYSQL_PASSWORD: mall123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mall-redis
    # protected-mode no：允许 web02 跨主机访问缓存
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: ./app
    container_name: mall-app
    environment:
      DB_HOST: mysql
      DB_USER: mall
      DB_PASSWORD: mall123
      DB_NAME: mall
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mall-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data: