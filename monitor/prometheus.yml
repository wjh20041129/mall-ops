# Prometheus 配置，跑在控制机上
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets:
        - 192.168.233.101:9100   # controlNode
        - 192.168.233.102:9100   # web01
        - 192.168.233.103:9100   # web02
        - 192.168.233.104:9100   # db01