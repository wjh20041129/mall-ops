# 负载均衡：轮询分发到两台应用节点（第二阶段）
# web01 用 compose 网络内的 app 服务名直连；web02 走宿主机 IP
# log_format 里带上 $upstream_addr，方便验证请求轮询到了哪台后端
log_format malllog '$remote_addr [$time_local] "$request" -> $upstream_addr';

upstream mall {
    server app:5000;
    server 192.168.93.102:5000;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log malllog;

    location / {
        proxy_pass http://mall;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}